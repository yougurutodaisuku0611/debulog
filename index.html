<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダイエットトラッカー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f5f2;
    --surface: #ffffff;
    --surface-2: #f0efe9;
    --border: #e0ddd3;
    --text: #23231f;
    --text-secondary: #6b6a63;
    --text-muted: #9b9a91;
    --accent: #3c7a5e;
    --accent-light: #e3efe8;
    --danger: #b2453a;
    --danger-light: #f7e6e4;
    --warning: #b9812b;
    --warning-light: #faf0dc;
    --radius: 10px;
    --radius-lg: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171715;
      --surface: #221f1c;
      --surface-2: #2a2723;
      --border: #3a362f;
      --text: #ece9e1;
      --text-secondary: #b3b0a6;
      --text-muted: #7d7a70;
      --accent: #6fb896;
      --accent-light: #223a30;
      --danger: #e08277;
      --danger-light: #3a2422;
      --warning: #dcb15f;
      --warning-light: #3a2f1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 76px;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1, h2, h3 { font-weight: 600; margin: 0 0 12px; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; }
  h3 { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
  p { margin: 0; }
  .hidden { display: none !important; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 16px;
  }
  .topbar .profile-select {
    font-size: 13px; color: var(--text-secondary); background: none; border: none;
  }
  .icon-btn {
    background: none; border: none; color: var(--text-secondary); font-size: 20px;
    cursor: pointer; padding: 6px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 600; }
  .metric-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .progress-track {
    height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 6px;
  }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }

  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  button.secondary {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 16px; font-size: 14px; cursor: pointer; width: 100%;
  }
  button.ghost {
    background: none; border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 14px; font-size: 13px; color: var(--text-secondary); cursor: pointer; width: 100%;
  }
  button.small { width: auto; padding: 6px 12px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); font-size: 14px; margin-top: 4px;
  }
  label { font-size: 13px; color: var(--text-secondary); display: block; margin-top: 10px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .name { font-size: 14px; font-weight: 500; }
  .list-item .sub { font-size: 12px; color: var(--text-muted); }
  .list-item .val { font-size: 14px; font-weight: 600; }
  .del-btn { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px 8px; }

  .tag {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-light); color: var(--accent); margin-right: 4px;
  }
  .tag.warn { background: var(--warning-light); color: var(--warning); }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
    border-top: 1px solid var(--border); display: flex; max-width: 480px; margin: 0 auto;
  }
  .tabbar button {
    flex: 1; background: none; border: none; padding: 10px 0 8px; font-size: 10px;
    color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tabbar button.active { color: var(--accent); }
  .tabbar svg { width: 20px; height: 20px; }

  .period-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  .period-toggle button {
    flex: 1; padding: 6px; font-size: 12px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary); cursor: pointer;
  }
  .period-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-sheet {
    background: var(--surface); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 20px; max-height: 88vh; overflow-y: auto;
  }
  .modal-sheet .modal-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
  }

  .error-text { color: var(--danger); font-size: 12px; margin-top: 6px; }
  .hint-text { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
  .loading-text { color: var(--accent); font-size: 13px; margin-top: 8px; }

  .analysis-box {
    background: var(--surface-2); border-radius: var(--radius); padding: 12px; margin-top: 12px;
  }
  .analysis-box .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  img.preview { width: 100%; border-radius: var(--radius); margin-top: 8px; max-height: 220px; object-fit: cover; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==================== 定数 ==================== */
const METS_TABLE = [
  { key: "walk_normal", label: "ウォーキング(普通)", mets: 3.5 },
  { key: "walk_fast", label: "ウォーキング(速歩)", mets: 4.8 },
  { key: "jog", label: "ジョギング", mets: 7.0 },
  { key: "run_fast", label: "ランニング(速い)", mets: 9.8 },
  { key: "bike_normal", label: "自転車(普通)", mets: 6.0 },
  { key: "bike_fast", label: "自転車(速い)", mets: 10.0 },
  { key: "swim_slow", label: "水泳(ゆっくり)", mets: 6.0 },
  { key: "swim_crawl", label: "水泳(クロール)", mets: 8.3 },
  { key: "strength", label: "筋力トレーニング", mets: 5.0 },
  { key: "yoga", label: "ヨガ", mets: 2.5 },
  { key: "jump_rope", label: "縄跳び", mets: 10.0 },
  { key: "stairs", label: "階段昇降", mets: 8.0 },
  { key: "custom", label: "その他(METs手入力)", mets: null },
];

const ACTIVITY_LEVELS = [
  { key: "sedentary", label: "ほぼ座りっぱなし", factor: 1.2 },
  { key: "light", label: "軽い運動(週1-3回)", factor: 1.375 },
  { key: "moderate", label: "適度な運動(週3-5回)", factor: 1.55 },
  { key: "active", label: "活発(週6-7回)", factor: 1.725 },
];

const GEMINI_MODELS = [
  { key: "gemini-3.6-flash", label: "Gemini 3.6 Flash(標準・無料枠あり)" },
  { key: "gemini-3.5-flash-lite", label: "Gemini 3.5 Flash-Lite(軽量・無料枠広め)" },
  { key: "gemini-3.7-flash", label: "Gemini 3.7 Flash(最新・無料枠は要確認)" },
];

/* ==================== ストレージ層 ==================== */
const Store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) { localStorage.setItem(key, JSON.stringify(value)); },
  profileKey(base, profileId) { return `${base}:${profileId}`; },
};

function loadGlobal() {
  let model = Store.get("gemini_model", "gemini-3.6-flash");
  // 廃止された旧モデル名を保存している場合は自動的に最新モデルへ移行する
  const validKeys = GEMINI_MODELS.map(m => m.key);
  if (!validKeys.includes(model)) model = "gemini-3.6-flash";
  return {
    apiKey: Store.get("gemini_api_key", ""),
    model,
    profiles: Store.get("profiles", [{ id: "p1", name: "自分" }]),
    currentProfileId: Store.get("currentProfileId", "p1"),
  };
}
function saveGlobal(g) {
  Store.set("gemini_api_key", g.apiKey);
  Store.set("gemini_model", g.model);
  Store.set("profiles", g.profiles);
  Store.set("currentProfileId", g.currentProfileId);
}

function loadProfileData(profileId) {
  return {
    weightLogs: Store.get(Store.profileKey("weightLogs", profileId), []),
    mealLogs: Store.get(Store.profileKey("mealLogs", profileId), []),
    exerciseLogs: Store.get(Store.profileKey("exerciseLogs", profileId), []),
    goals: Store.get(Store.profileKey("goals", profileId), {
      height: null, age: null, gender: "female", activityLevel: "light",
      startWeight: null, startDate: null, targetWeight: null, targetDate: null,
    }),
  };
}
function saveProfileData(profileId, data) {
  Store.set(Store.profileKey("weightLogs", profileId), data.weightLogs);
  Store.set(Store.profileKey("mealLogs", profileId), data.mealLogs);
  Store.set(Store.profileKey("exerciseLogs", profileId), data.exerciseLogs);
  Store.set(Store.profileKey("goals", profileId), data.goals);
}

/* ==================== アプリ状態 ==================== */
let G = loadGlobal();
let P = loadProfileData(G.currentProfileId);
let currentTab = "home";
let weightPeriod = "week";
let chartInstance = null;

function persist() { saveGlobal(G); saveProfileData(G.currentProfileId, P); }

function todayStr() { return new Date().toISOString().slice(0, 10); }
function uid() { return Math.random().toString(36).slice(2, 10); }

/* ==================== 計算ロジック ==================== */
function latestWeight() {
  if (P.weightLogs.length === 0) return P.goals.startWeight || null;
  const sorted = [...P.weightLogs].sort((a, b) => a.date.localeCompare(b.date));
  return sorted[sorted.length - 1].weight;
}
function calcBMI(weightKg, heightCm) {
  if (!weightKg || !heightCm) return null;
  const h = heightCm / 100;
  return weightKg / (h * h);
}
function calcBMR({ weight, height, age, gender }) {
  if (!weight || !height || !age) return null;
  // Mifflin-St Jeor
  const base = 10 * weight + 6.25 * height - 5 * age;
  return gender === "male" ? base + 5 : base - 161;
}
function todaysBurned() {
  // 基礎代謝分は含めず、運動記録による実測の消費カロリーのみを対象とする
  const today = todayStr();
  const exerciseKcal = P.exerciseLogs.filter(e => e.date === today).reduce((s, e) => s + e.caloriesBurned, 0);
  return { exerciseKcal, total: exerciseKcal };
}
function goalsBMRInfo() {
  const g = P.goals;
  const w = latestWeight();
  const bmr = calcBMR({ weight: w, height: g.height, age: g.age, gender: g.gender });
  const factorObj = ACTIVITY_LEVELS.find(a => a.key === g.activityLevel) || ACTIVITY_LEVELS[0];
  const tdee = bmr ? bmr * factorObj.factor : null;
  return { bmr, tdee };
}
function dailySum(logs, dateField, valueField, date) {
  return logs.filter(l => l[dateField] === date).reduce((s, l) => s + (l[valueField] || 0), 0);
}
function dateRangeArray(days) {
  const arr = [];
  const d = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const dt = new Date(d);
    dt.setDate(d.getDate() - i);
    arr.push(dt.toISOString().slice(0, 10));
  }
  return arr;
}
function todaysIntake() {
  const today = todayStr();
  return P.mealLogs.filter(m => m.date === today).reduce((s, m) => s + (m.calories || 0), 0);
}

/* ==================== Gemini API ==================== */
async function callGemini({ imageBase64, mimeType, text }) {
  if (!G.apiKey) throw new Error("APIキーが設定されていません。設定画面から入力してください。");
  const promptText = `あなたは栄養士です。次の食事を分析し、以下のJSONスキーマのみで回答してください。説明文やMarkdownのコードブロックは一切含めないでください。
{
  "food_name": "推定される料理名(日本語)",
  "estimated_calories": 数値(kcal),
  "confidence": "high" | "medium" | "low",
  "macros": { "carbs_g": 数値, "protein_g": 数値, "fat_g": 数値, "fiber_g": 数値 },
  "diet_factors": { "sodium_mg": 数値, "gi_estimate": "high" | "medium" | "low", "sugar_g": 数値 },
  "notes": "ダイエット上の注意点を日本語1文で"
}
${text ? `食事内容のテキスト: "${text}"` : "添付された画像の食事を分析してください。"}`;

  const parts = [{ text: promptText }];
  if (imageBase64) parts.push({ inline_data: { mime_type: mimeType, data: imageBase64 } });

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${G.model}:generateContent?key=${encodeURIComponent(G.apiKey)}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts }],
      generationConfig: { responseMimeType: "application/json" },
    }),
  });
  if (!res.ok) {
    const errBody = await res.text();
    throw new Error(`Gemini APIエラー (${res.status}): ${errBody.slice(0, 200)}`);
  }
  const data = await res.json();
  const textOut = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!textOut) throw new Error("応答の解析に失敗しました。");
  try {
    return JSON.parse(textOut);
  } catch (e) {
    throw new Error("Geminiの応答をJSONとして解釈できませんでした。");
  }
}

/* ==================== レンダリング共通 ==================== */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = renderTopbar() + renderTab() ;
  app.insertAdjacentHTML("beforeend", renderTabbar());
  attachHandlers();
}

function renderTopbar() {
  const profileOptions = G.profiles.map(p =>
    `<option value="${p.id}" ${p.id === G.currentProfileId ? "selected" : ""}>${escapeHtml(p.name)}</option>`
  ).join("");
  return `
  <div class="topbar">
    <select id="profileSelect" class="profile-select">${profileOptions}</select>
    <button class="icon-btn" id="goSettings" aria-label="設定">⚙</button>
  </div>`;
}

function renderTab() {
  if (currentTab === "home") return renderHome();
  if (currentTab === "meals") return renderMeals();
  if (currentTab === "exercise") return renderExercise();
  if (currentTab === "weight") return renderWeight();
  if (currentTab === "goals") return renderGoals();
  if (currentTab === "settings") return renderSettings();
  return "";
}

function renderTabbar() {
  const tabs = [
    { key: "home", label: "ホーム" },
    { key: "meals", label: "食事" },
    { key: "exercise", label: "運動" },
    { key: "weight", label: "体重" },
    { key: "goals", label: "目標" },
  ];
  return `<div class="tabbar">${tabs.map(t =>
    `<button data-tab="${t.key}" class="${currentTab === t.key ? "active" : ""}">${t.label}</button>`
  ).join("")}</div>`;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(n, digits = 0) {
  if (n === null || n === undefined || isNaN(n)) return "-";
  return Number(n).toLocaleString("ja-JP", { maximumFractionDigits: digits, minimumFractionDigits: digits });
}

/* ==================== ホーム ==================== */
function renderHome() {
  const intake = todaysIntake();
  const burn = todaysBurned();
  const g = P.goals;
  const w = latestWeight();
  const bmi = calcBMI(w, g.height);

  let progressHtml = "";
  if (g.startWeight && g.targetWeight && w !== null) {
    const totalDelta = g.startWeight - g.targetWeight;
    const doneDelta = g.startWeight - w;
    const pct = totalDelta !== 0 ? Math.min(100, Math.max(0, (doneDelta / totalDelta) * 100)) : 0;
    const remaining = (w - g.targetWeight).toFixed(1);
    progressHtml = `
    <div class="card">
      <h3>目標までの進捗</h3>
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <span class="metric-value">${fmt(pct, 0)}%</span>
        <span style="font-size:13px; color:var(--text-secondary);">残り ${remaining}kg</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  } else {
    progressHtml = `<div class="card"><h3>目標</h3><p class="hint-text">「目標」タブから目標体重を設定すると、ここに進捗が表示されます。</p></div>`;
  }

  return `
  <h1>今日のサマリー</h1>
  <div class="card">
    <div class="grid-2">
      <div>
        <div class="metric-label">摂取カロリー</div>
        <div class="metric-value">${fmt(intake)} <span style="font-size:13px; font-weight:400;">kcal</span></div>
      </div>
      <div>
        <div class="metric-label">消費カロリー(運動)</div>
        <div class="metric-value">${fmt(burn.total)} <span style="font-size:13px; font-weight:400;">kcal</span></div>
        <div class="metric-sub">基礎代謝は含みません。参考値は目標タブへ</div>
      </div>
    </div>
  </div>
  ${progressHtml}
  <div class="card">
    <h3>体組成</h3>
    <div class="grid-2">
      <div><div class="metric-label">現在の体重</div><div class="metric-value">${w !== null ? fmt(w, 1) + "kg" : "-"}</div></div>
      <div><div class="metric-label">BMI</div><div class="metric-value">${bmi !== null ? fmt(bmi, 1) : "-"}</div></div>
    </div>
  </div>
  <button class="ghost" id="quickAddMeal">📷 食事を記録する</button>
  `;
}

/* ==================== 食事 ==================== */
function renderMeals() {
  const grouped = {};
  [...P.mealLogs].sort((a, b) => b.timestamp.localeCompare(a.timestamp)).forEach(m => {
    grouped[m.date] = grouped[m.date] || [];
    grouped[m.date].push(m);
  });
  const dates = Object.keys(grouped).sort().reverse().slice(0, 14);

  const listHtml = dates.length === 0
    ? `<p class="hint-text">まだ記録がありません。下のボタンから食事を追加しましょう。</p>`
    : dates.map(date => `
      <div class="card">
        <h3>${date}</h3>
        ${grouped[date].map(m => `
          <div class="list-item" data-view-meal="${m.id}" style="cursor:pointer;">
            <div>
              <div class="name">${escapeHtml(m.food_name)}</div>
              <div class="sub">${m.macros ? `糖質${fmt(m.macros.carbs_g)}g / 脂質${fmt(m.macros.fat_g)}g / たんぱく質${fmt(m.macros.protein_g)}g` : ""}</div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="val">${fmt(m.calories)}kcal</span>
              <button class="del-btn" data-del-meal="${m.id}">✕</button>
            </div>
          </div>`).join("")}
      </div>`).join("");

  return `
  <h1>食事記録</h1>
  <button class="primary" id="openMealModal" style="margin-bottom:16px;">＋ 食事を追加</button>
  ${listHtml}
  `;
}

function renderMealModal() {
  return `
  <div class="modal-overlay" id="mealModalOverlay">
    <div class="modal-sheet">
      <div class="modal-head"><h2>食事を追加</h2><button class="icon-btn" id="closeMealModal">✕</button></div>

      <label>方法</label>
      <div class="period-toggle">
        <button type="button" id="modeImage" class="active">写真から解析</button>
        <button type="button" id="modeText">テキストで入力</button>
      </div>

      <div id="imageInputArea">
        <input type="file" accept="image/*" id="mealImageInput">
        <img class="preview hidden" id="mealImagePreview">
      </div>
      <div id="textInputArea" class="hidden">
        <label>食事の内容</label>
        <textarea id="mealTextInput" rows="3" placeholder="例: 鶏胸肉のグリル、玄米ご飯150g、味噌汁"></textarea>
      </div>

      <button class="primary" id="analyzeMealBtn" style="margin-top:14px;">Geminiで解析する</button>
      <div id="analyzeStatus"></div>
      <div id="analyzeResultBox"></div>
    </div>
  </div>`;
}

/* ==================== 運動 ==================== */
function renderExercise() {
  const items = [...P.exerciseLogs].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 30);
  const listHtml = items.length === 0
    ? `<p class="hint-text">まだ記録がありません。</p>`
    : items.map(e => `

function drawWeightChart() {
  const canvas = document.getElementById("weightChart");
  if (!canvas || typeof Chart === "undefined") return;
  const days = weightPeriod === "week" ? 7 : weightPeriod === "month" ? 30 : 365;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  const logs = [...P.weightLogs].filter(l => l.date >= cutoffStr).sort((a, b) => a.date.localeCompare(b.date));
  const labels = logs.map(l => l.date);
  const weights = logs.map(l => l.weight);

  let goalLine = null;
  const g = P.goals;
  if (g.startWeight && g.targetWeight && g.startDate && g.targetDate && labels.length > 0) {
    const start = new Date(g.startDate).getTime();
    const end = new Date(g.targetDate).getTime();
    goalLine = labels.map(d => {
      const t = new Date(d).getTime();
      if (end === start) return g.targetWeight;
      const ratio = Math.min(1, Math.max(0, (t - start) / (end - start)));
      return g.startWeight + (g.targetWeight - g.startWeight) * ratio;
    });
  }

  const datasets = [{
    label: "体重(kg)",
    data: weights,
    borderColor: "#3c7a5e",
    backgroundColor: "rgba(60,122,94,0.1)",
    tension: 0.3,
    fill: true,
  }];
  if (goalLine) {
    datasets.push({
      label: "目標ライン",
      data: goalLine,
      borderColor: "#b9812b",
      borderDash: [5, 5],
      pointRadius: 0,
      fill: false,
    });
  }

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(canvas, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { display: true, labels: { font: { size: 11 } } } },
      scales: { y: { ticks: { font: { size: 11 } } }, x: { ticks: { font: { size: 10 } } } },
    },
  });
}

let calorieChartInstance = null;
function drawCalorieChart() {
  const canvas = document.getElementById("calorieChart");
  if (!canvas || typeof Chart === "undefined") return;
  const days = weightPeriod === "week" ? 7 : weightPeriod === "month" ? 30 : 365;
  const labels = dateRangeArray(days);
  const intakeData = labels.map(d => dailySum(P.mealLogs, "date", "calories", d));
  const burnData = labels.map(d => dailySum(P.exerciseLogs, "date", "caloriesBurned", d));

  if (calorieChartInstance) calorieChartInstance.destroy();
  calorieChartInstance = new Chart(canvas, {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: "摂取kcal", data: intakeData, backgroundColor: "rgba(60,122,94,0.6)" },
        { label: "消費kcal(運動)", data: burnData, backgroundColor: "rgba(185,129,43,0.6)" },
      ],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: true, labels: { font: { size: 11 } } } },
      scales: {
        y: { ticks: { font: { size: 11 } }, beginAtZero: true },
        x: { ticks: { font: { size: 9 }, maxRotation: 60, minRotation: 0 } },
      },
    },
  });
}

/* ==================== イベント処理 ==================== */
function attachHandlers() {
  document.getElementById("profileSelect")?.addEventListener("change", e => {
    G.currentProfileId = e.target.value;
    saveGlobal(G);
    P = loadProfileData(G.currentProfileId);
    render();
  });
  document.getElementById("goSettings")?.addEventListener("click", () => { currentTab = "settings"; render(); });
  document.querySelectorAll(".tabbar button").forEach(btn => {
    btn.addEventListener("click", () => { currentTab = btn.dataset.tab; render(); });
  });
  document.getElementById("quickAddMeal")?.addEventListener("click", () => { currentTab = "meals"; render(); openMealModal(); });
  document.getElementById("openMealModal")?.addEventListener("click", openMealModal);

  // 食事削除(詳細モーダルを開かないようにイベント伝播を止める)
  document.querySelectorAll("[data-del-meal]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      P.mealLogs = P.mealLogs.filter(m => m.id !== btn.dataset.delMeal);
      persist(); render();
    });
  });
  // 食事詳細(解析結果)を記録から呼び出す
  document.querySelectorAll("[data-view-meal]").forEach(item => {
    item.addEventListener("click", () => openMealDetailModal(item.dataset.viewMeal));
  });

  // 運動
  const exerciseSelect = document.getElementById("exerciseSelect");
  const customRow = document.getElementById("customMetsRow");
  const updateEstimate = () => {
    const key = exerciseSelect?.value;
    const item = METS_TABLE.find(m => m.key === key);
    const mets = item?.key === "custom" ? parseFloat(document.getElementById("customMets")?.value) : item?.mets;
    const dur = parseFloat(document.getElementById("exerciseDuration")?.value);
    const w = latestWeight();
    const est = document.getElementById("exerciseEstimate");
    if (mets && dur && w && est) {
      const kcal = mets * w * (dur / 60);
      est.textContent = `推定消費カロリー: 約${Math.round(kcal)}kcal`;
    } else if (est) { est.textContent = ""; }
  };
  exerciseSelect?.addEventListener("change", () => {
    customRow.style.display = exerciseSelect.value === "custom" ? "block" : "none";
    updateEstimate();
  });
  document.getElementById("customMets")?.addEventListener("input", updateEstimate);
  document.getElementById("exerciseDuration")?.addEventListener("input", updateEstimate);
  document.getElementById("addExerciseBtn")?.addEventListener("click", () => {
    const key = exerciseSelect.value;
    const item = METS_TABLE.find(m => m.key === key);
    const mets = item.key === "custom" ? parseFloat(document.getElementById("customMets").value) : item.mets;
    const dur = parseFloat(document.getElementById("exerciseDuration").value);
    const date = document.getElementById("exerciseDate").value;
    const w = latestWeight();
    if (!mets || !dur || !date) { alert("種目・時間・日付を入力してください。"); return; }
    if (!w) { alert("先に体重を1件記録してください(消費カロリー計算に使用します)。"); return; }
    const kcal = mets * w * (dur / 60);
    P.exerciseLogs.push({
      id: uid(), date, activityKey: key,
      activityLabel: item.key === "custom" ? `その他(METs ${mets})` : item.label,
      durationMin: dur, caloriesBurned: Math.round(kcal),
    });
    persist(); render();
  });
  document.querySelectorAll("[data-del-exercise]").forEach(btn => {
    btn.addEventListener("click", () => {
      P.exerciseLogs = P.exerciseLogs.filter(e => e.id !== btn.dataset.delExercise);
      persist(); render();
    });
  });

  // 体重
  document.getElementById("addWeightBtn")?.addEventListener("click", () => {
    const date = document.getElementById("weightDate").value;
    const weight = parseFloat(document.getElementById("weightInput").value);
    const bodyFatRaw = document.getElementById("bodyFatInput").value;
    const note = document.getElementById("weightNote").value;
    if (!date || !weight) { alert("日付と体重を入力してください。"); return; }
    const existingIdx = P.weightLogs.findIndex(l => l.date === date);
    const entry = { date, weight, bodyFatPct: bodyFatRaw ? parseFloat(bodyFatRaw) : null, note };
    if (existingIdx >= 0) P.weightLogs[existingIdx] = entry; else P.weightLogs.push(entry);
    persist(); render();
  });
  document.querySelectorAll("[data-period]").forEach(btn => {
    btn.addEventListener("click", () => { weightPeriod = btn.dataset.period; render(); });
  });
  if (currentTab === "weight") setTimeout(() => { drawWeightChart(); drawCalorieChart(); }, 0);

  // 目標
  document.getElementById("saveGoalsBtn")?.addEventListener("click", () => {
    P.goals = {
      height: parseFloat(document.getElementById("goalHeight").value) || null,
      age: parseFloat(document.getElementById("goalAge").value) || null,
      gender: document.getElementById("goalGender").value,
      activityLevel: document.getElementById("goalActivity").value,
      startWeight: parseFloat(document.getElementById("goalStartWeight").value) || null,
      startDate: document.getElementById("goalStartDate").value || null,
      targetWeight: parseFloat(document.getElementById("goalTargetWeight").value) || null,
      targetDate: document.getElementById("goalTargetDate").value || null,
    };
    persist();
    alert("目標を保存しました。");
    currentTab = "home"; render();
  });

  // 設定
  document.getElementById("saveApiBtn")?.addEventListener("click", () => {
    G.apiKey = document.getElementById("apiKeyInput").value.trim();
    G.model = document.getElementById("modelSelect").value;
    saveGlobal(G);
    alert("保存しました。");
  });
  document.getElementById("addProfileBtn")?.addEventListener("click", () => {
    const name = document.getElementById("newProfileName").value.trim();
    if (!name) return;
    const id = uid();
    G.profiles.push({ id, name });
    G.currentProfileId = id;
    saveGlobal(G);
    P = loadProfileData(id);
    render();
  });
  document.querySelectorAll("[data-del-profile]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.delProfile;
      if (G.profiles.length <= 1) return;
      if (!confirm("このプロフィールと記録データを削除します。よろしいですか?")) return;
      G.profiles = G.profiles.filter(p => p.id !== id);
      ["weightLogs", "mealLogs", "exerciseLogs", "goals"].forEach(k => localStorage.removeItem(Store.profileKey(k, id)));
      if (G.currentProfileId === id) G.currentProfileId = G.profiles[0].id;
      saveGlobal(G);
      P = loadProfileData(G.currentProfileId);
      render();
    });
  });
}

function closeMealDetailModal() {

/* ==================== 食事モーダル ==================== */
let mealMode = "image";
let mealImageBase64 = null;
let mealImageMime = null;
let lastAnalysis = null;

function openMealModal() {
  document.body.insertAdjacentHTML("beforeend", renderMealModal());
  mealMode = "image"; mealImageBase64 = null; mealImageMime = null; lastAnalysis = null;

  document.getElementById("closeMealModal").addEventListener("click", closeMealModal);
  document.getElementById("mealModalOverlay").addEventListener("click", e => {
    if (e.target.id === "mealModalOverlay") closeMealModal();
  });
  document.getElementById("modeImage").addEventListener("click", () => switchMealMode("image"));
  document.getElementById("modeText").addEventListener("click", () => switchMealMode("text"));
  document.getElementById("mealImageInput").addEventListener("change", handleImageSelect);
  document.getElementById("analyzeMealBtn").addEventListener("click", runAnalysis);
}
function closeMealModal() {
  document.getElementById("mealModalOverlay")?.remove();
}
function switchMealMode(mode) {
  mealMode = mode;
  document.getElementById("modeImage").classList.toggle("active", mode === "image");
  document.getElementById("modeText").classList.toggle("active", mode === "text");
  document.getElementById("imageInputArea").classList.toggle("hidden", mode !== "image");
  document.getElementById("textInputArea").classList.toggle("hidden", mode !== "text");
}
function handleImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  mealImageMime = file.type;
  const reader = new FileReader();
  reader.onload = () => {
    mealImageBase64 = reader.result.split(",")[1];
    const preview = document.getElementById("mealImagePreview");
    preview.src = reader.result;
    preview.classList.remove("hidden");
  };
  reader.readAsDataURL(file);
}
async function runAnalysis() {
  const statusEl = document.getElementById("analyzeStatus");
  const resultBox = document.getElementById("analyzeResultBox");
  resultBox.innerHTML = "";
  statusEl.innerHTML = `<p class="loading-text">Geminiで解析中...</p>`;
  try {
    let result;
    if (mealMode === "image") {
      if (!mealImageBase64) throw new Error("画像を選択してください。");
      result = await callGemini({ imageBase64: mealImageBase64, mimeType: mealImageMime });
    } else {
      const text = document.getElementById("mealTextInput").value.trim();
      if (!text) throw new Error("食事内容を入力してください。");
      result = await callGemini({ text });
    }
    lastAnalysis = result;
    statusEl.innerHTML = "";
    resultBox.innerHTML = `
    <div class="analysis-box">
      <p style="font-weight:600;">${escapeHtml(result.food_name)}</p>
      <div class="row"><span>推定カロリー</span><span>${fmt(result.estimated_calories)}kcal</span></div>
      <div class="row"><span>糖質 / 脂質 / たんぱく質</span><span>${fmt(result.macros?.carbs_g)}g / ${fmt(result.macros?.fat_g)}g / ${fmt(result.macros?.protein_g)}g</span></div>
      <div class="row"><span>食物繊維</span><span>${fmt(result.macros?.fiber_g)}g</span></div>
      <div class="row"><span>塩分</span><span>${fmt(result.diet_factors?.sodium_mg)}mg</span></div>
      <div style="margin-top:6px;"><span class="tag ${result.diet_factors?.gi_estimate === "high" ? "warn" : ""}">GI: ${escapeHtml(result.diet_factors?.gi_estimate || "-")}</span></div>
      <p class="hint-text" style="margin-top:8px;">${escapeHtml(result.notes || "")}</p>
    </div>
    <button class="primary" id="confirmSaveMeal" style="margin-top:12px;">この内容で記録する</button>
    `;
    document.getElementById("confirmSaveMeal").addEventListener("click", saveMealFromAnalysis);
  } catch (err) {
    statusEl.innerHTML = `<p class="error-text">${escapeHtml(err.message)}</p>`;
  }
}
function saveMealFromAnalysis() {
  if (!lastAnalysis) return;
  const now = new Date();
  P.mealLogs.push({
    id: uid(), date: now.toISOString().slice(0, 10), timestamp: now.toISOString(),
    food_name: lastAnalysis.food_name, calories: lastAnalysis.estimated_calories,
    macros: lastAnalysis.macros, diet_factors: lastAnalysis.diet_factors, notes: lastAnalysis.notes,
  });
  persist();
  closeMealModal();
  render();
}

/* ==================== 起動 ==================== */
render();
